{% load filters %}
{% with new_element_id=element.id|append_uuid %}

<div class="card">
    <div class="card-header">
        <span>{{ element.details.title|default:"Chart Title" }}</span>
        
        <div class="status-indicator-group"> 
            <span class="status-indicator" id="{{ new_element_id }}-connection-status" title="Device Connection Status">
                <i class="fas fa-plug"></i>
                <span class="status-text">Offline</span>
            </span>
            <span class="status-indicator" id="{{ new_element_id }}-subscription-status" title="Data Subscription Status">
                <i class="far fa-bell-slash"></i>
                <span class="status-text">Unsubscribed</span>
            </span>
            <span class="status-indicator" id="{{ new_element_id }}-permissions-status" title="Your Permissions">
                <i class="fas fa-key"></i>
                <span class="status-text">None</span>
            </span>
        </div>
    </div>
    <div class="card-body">
        <div class="chart-container" style="height: 250px; position: relative;">
            <canvas id="{{ new_element_id }}"></canvas>
        </div>
        <p class="text-center mt-3">
            Current Value: <span id="{{ new_element_id }}-value">--</span>
            <span class="unit">{{ element.details.unit|default:"" }}</span>
        </p>
    </div>
</div>


<script>
    (function() {
        // Ensure the global registry exists
        if (typeof window.Elements === 'undefined') window.Elements = {};
        if (!window.Elements["{{ element.id }}"]) window.Elements["{{ element.id }}"] = [];
        
        const detailsDataElement = document.getElementById("{{ new_element_id|add:'-details-data' }}");
        let detailsObject = {};
        
        if (detailsDataElement) {
            detailsObject = JSON.parse(detailsDataElement.textContent);
        }

        const newChartInstance = new SensorChart(
            "{{ new_element_id }}",
            detailsObject
        );
        window.Elements["{{ element.id }}"].push(newChartInstance);
    })();
</script>

{% endwith %}
