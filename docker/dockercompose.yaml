version: "3.9"

services:
  node-red:
    image: nodered/node-red:latest-22
    container_name: node_red
    ports:
      - "1880:1880"
    volumes:
      - node_red_data:/data

  quak:
    build:
      context: ./../
      dockerfile: ./docker/Dockerfile
    container_name: quak
    depends_on:
      - db
      - redis
    command: >
      sh -c "python manage.py migrate &&
             daphne -b 0.0.0.0 -p 8000 myproject.asgi:application"
    ports:
      - "8000:8000"
    env_file:
      - enfile.env
    volumes:
      - media:/code/media
  db:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
  node_red_data:
  media:
